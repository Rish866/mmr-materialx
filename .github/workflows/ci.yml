name: CI

# Run on pushes and PRs targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: ['20']

    # Real PostgreSQL for integration tests (matches production engine).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mmr_test
        ports:
          - 5432:5432
        # wait until Postgres is actually ready before the job's steps run
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    # Safe, test-only environment. NO production secrets are used in CI.
    env:
      # Both point at the same throwaway CI database. `migrate` reads
      # DATABASE_URL; the test harness reads TEST_DATABASE_URL.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mmr_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mmr_test
      JWT_SECRET: ci-test-secret-not-a-real-key
      SMS_PROVIDER: console
      UPLOAD_PROVIDER: local
      PGSSL: disable

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (clean, from lockfile)
        run: npm ci

      - name: Lint (syntax gate)
        run: npm run lint

      - name: Apply database schema
        run: npm run migrate

      - name: Run tests
        run: npm test
